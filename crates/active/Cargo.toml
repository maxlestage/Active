[package]
name = "active"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A simple, fast front-end library for Rust: components, state, routing, complete SEO tags, server rendering and WebAssembly islands."
authors = ["Maxime Nathan Lestage"]
license-file = "LICENSE"
homepage = "https://active-c1883a966650.herokuapp.com/"
repository = "https://github.com/maxlestage/Active"
documentation = "https://docs.rs/active"
readme = "README.md"
keywords = ["frontend", "web", "seo", "wasm", "ssr"]
categories = ["web-programming", "wasm", "gui"]
include = ["src", "examples", "tests", "README.md", "LICENSE"]

[features]
default = []
# Browser side (compile for wasm32): hydrate islands, mount client-side apps, run effects,
# listen to events, route and update the <head>.
client = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[dependencies]
wasm-bindgen = { version = "0.2.100", optional = true }
wasm-bindgen-futures = { version = "0.4.50", optional = true }
js-sys = { version = "0.3.77", optional = true }
web-sys = { version = "0.3.77", optional = true, features = [
  "CharacterData",
  "Comment",
  "CssStyleDeclaration",
  "console",
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "FocusOptions",
  "History",
  "HtmlAnchorElement",
  "HtmlCollection",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Node",
  "NodeList",
  "Text",
  "UrlSearchParams",
  "Window",
] }

[package.metadata.docs.rs]
features = ["client"]
