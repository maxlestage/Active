[package]
name = "active"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "A simple, fast front-end library for Rust: components, state, routing, complete SEO tags, server rendering and WebAssembly islands."
authors = ["Maxime Nathan Lestage"]
license-file = "LICENSE"
homepage = "https://active-c1883a966650.herokuapp.com/"
repository = "https://github.com/maxlestage/Active"
documentation = "https://docs.rs/active"
readme = "README.md"
keywords = ["frontend", "web", "seo", "wasm", "ssr"]
categories = ["web-programming", "wasm", "gui"]
include = ["src", "examples", "tests", "README.md", "LICENSE"]

[features]
default = ["physics"]
# Rigid-body physics (active::physics, and the physics of active::scene and active::ecs).
# Without it (`default-features =
# false`), the server build has no dependency at all.
physics = [
  "dep:approx",
  "dep:arrayvec",
  "dep:bitflags",
  "dep:glamx",
  "dep:log",
  "dep:nalgebra",
  "dep:num-traits",
  "dep:parry3d",
  "dep:profiling",
  "dep:simba",
  "dep:static_assertions",
  "dep:thiserror",
  "dep:wide",
]
# Browser side (compile for wasm32): hydrate islands, mount client-side apps, run effects,
# listen to events, route and update the <head>.
client = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[dependencies]
wasm-bindgen = { version = "0.2.100", optional = true }
wasm-bindgen-futures = { version = "0.4.50", optional = true }
js-sys = { version = "0.3.77", optional = true }
web-sys = { version = "0.3.77", optional = true, features = [
  "AddEventListenerOptions",
  "CharacterData",
  "Comment",
  "CssStyleDeclaration",
  "console",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "FocusOptions",
  "History",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Node",
  "NodeList",
  "Performance",
  "PointerEvent",
  "Storage",
  "StorageEvent",
  "Text",
  "UrlSearchParams",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlFramebuffer",
  "WebGlProgram",
  "WebGlSampler",
  "WebGlShader",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "WheelEvent",
  "Window",
] }
# The libraries of the physics engine (feature `physics`): collisions, linear algebra,
# SIMD and the small crates it is written with.
approx = { version = "0.5", default-features = false, features = ["std"], optional = true }
arrayvec = { version = "0.7", default-features = false, optional = true }
bitflags = { version = "2", optional = true }
glamx = { version = "0.3.1", default-features = false, features = ["nalgebra"], optional = true }
log = { version = "0.4", optional = true }
nalgebra = { version = "0.35", default-features = false, features = ["macros", "std", "alloc"], optional = true }
num-traits = { version = "0.2", default-features = false, features = ["std"], optional = true }
parry3d = { version = "0.31.1", default-features = false, features = ["required-features", "std", "alloc"], optional = true }
profiling = { version = "1.0", optional = true }
simba = { version = "0.10.2", default-features = false, features = ["wide", "std"], optional = true }
static_assertions = { version = "1", optional = true }
thiserror = { version = "2", default-features = false, features = ["std"], optional = true }
wide = { version = "1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# The tests of the physics engine.
oorandom = { version = "11", default-features = false }

[package.metadata.docs.rs]
features = ["client"]

[[example]]
name = "physics_timing"
required-features = ["physics"]
