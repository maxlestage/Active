[package]
name = "hello"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.129"

# Profile validated by the benchmarks (bench/RESULTS.md): fast and small.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
