[package]
name = "ssr-leptos"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
bench-common.workspace = true
leptos = { version = "0.8", features = ["ssr"] }
leptos_meta = { version = "0.8", features = ["ssr"] }
# leptos_meta injects the head tags asynchronously, on Leptos' global executor (as in
# leptos_axum): a current-thread Tokio runtime here.
any_spawner = { version = "0.3", features = ["tokio"] }
futures = "0.3"
tokio = { version = "1", features = ["rt"] }
