[package]
name = "counter-active"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# One crate, two targets: the library hydrates the counter in the browser (wasm32), the
# binary (src/main.rs) prints the server HTML of the page.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bench-common.workspace = true
active.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
active = { workspace = true, features = ["client"] }
wasm-bindgen.workspace = true
