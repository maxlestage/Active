[package]
name = "counter-sycamore"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# One crate, two targets: the library hydrates the counter in the browser (wasm32), the
# binary (src/main.rs) prints the server HTML of the page.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bench-common.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sycamore = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
sycamore = { version = "0.9", features = ["hydrate"] }
wasm-bindgen.workspace = true
