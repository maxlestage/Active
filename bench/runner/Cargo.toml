[package]
name = "runner"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Builds and runs every benchmark, then writes results/*.json and RESULTS.md."

[dependencies]
chromiumoxide = { version = "0.9", default-features = false }
# zlib-rs: a Rust port of zlib, whose level 9 output matches `gzip -9` closely.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
