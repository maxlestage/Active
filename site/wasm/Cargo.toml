[package]
name = "active-site"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
active = { path = "../../crates/active" }
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s" # size matters more than speed for this small module
lto = true
codegen-units = 1
panic = "abort"
strip = true
