[package]
name = "active-site"
version = "0.1.0"
edition = "2024"
publish = false
description = "Presentation site and documentation of active, written with active."

# The library part holds the islands (shared by the server and the browser) and, compiled
# to WebAssembly, the browser bundle. The binary is the web server.
[lib]
name = "active_site"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "active-site"
path = "src/main.rs"

[dependencies]
active = { path = "../crates/active" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Checks that the web app manifest and the service worker's lists are valid JSON.
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
active = { path = "../crates/active", features = ["client"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "Clipboard",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomStringMap",
  "DomTokenList",
  "Element",
  "EventTarget",
  "FontFaceSet",
  "HtmlCanvasElement",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlInputElement",
  "ImageData",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "NodeList",
  "Performance",
  "PointerEvent",
  "Response",
  "Window",
] }
