name: Pages

# Publishes the website on GitHub Pages (https://<owner>.github.io/<repository>/) as static
# files: `active-site export` renders every page with the server's own code, links behind
# the repository's path.
#
# Runs after every successful CI run of a push, which has just merged its branch into
# master (a push made by a workflow does not start other workflows, so this waits for CI
# instead of listening to pushes), and by hand from the Actions tab. A red CI publishes
# nothing.
#
# One-time setup, possible from the GitHub app or the mobile website:
# Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits instead of cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The repositories are private: Cargo fetches the git dependencies (the other
  # repositories of the ecosystem) through git, which asks GitHub's credentials to a
  # helper reading the REPOS_TOKEN secret, a GitHub token that can read them. The
  # token stays out of every URL; without the secret, nothing changes.
  REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: ${{ secrets.REPOS_TOKEN != '' && 1 || 0 }}
  GIT_CONFIG_KEY_0: credential.https://github.com.helper
  GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$REPOS_TOKEN"; }; f'
  CARGO_TERM_COLOR: always

jobs:
  # Until Pages is switched on (see the setup above), skip with a warning instead of failing.
  check:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        !startsWith(github.event.workflow_run.head_branch, 'wip/'))
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$source" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GitHub Pages is not published by GitHub Actions yet: Settings → Pages → Build and deployment → Source: GitHub Actions."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the browser bundle
        run: |
          cargo build -p active-site --lib --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target web --no-typescript --out-dir site/pkg target/wasm32-unknown-unknown/wasm-release/active_site.wasm
      - name: Export the site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: cargo run --release -p active-site -- export dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
