name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Lint (server)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint (browser)
        run: |
          cargo clippy -p active --features client --target wasm32-unknown-unknown -- -D warnings
          cargo clippy -p active-site -p hello -p spa --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Same commands as the Dockerfile used by Heroku.
      - name: Build the site
        run: |
          cargo build -p active-site --lib --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target web --out-dir site/pkg target/wasm32-unknown-unknown/wasm-release/active_site.wasm
          cargo build -p active-site --bin active-site --release
      - name: Package the crate
        run: cargo package -p active --allow-dirty

  # Every branch pushed by Claude (claude/...) is merged into master once everything is green.
  merge:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
    needs: [rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge into master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin master
