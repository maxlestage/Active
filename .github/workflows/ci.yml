name: CI

on:
  push:
  pull_request:

env:
  # The repositories are private: Cargo fetches the git dependencies (the other
  # repositories of the ecosystem) through git, which asks GitHub's credentials to a
  # helper reading the REPOS_TOKEN secret, a GitHub token that can read them. The
  # token stays out of every URL; without the secret, nothing changes.
  REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: ${{ secrets.REPOS_TOKEN != '' && 1 || 0 }}
  GIT_CONFIG_KEY_0: credential.https://github.com.helper
  GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$REPOS_TOKEN"; }; f'
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Lint (server)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint (browser)
        run: |
          cargo clippy -p active --features client --target wasm32-unknown-unknown -- -D warnings
          cargo clippy -p active-site -p hello -p spa --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Same commands as the Dockerfile used by Heroku.
      - name: Build the site
        run: |
          cargo build -p active-site --lib --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target web --no-typescript --out-dir site/pkg target/wasm32-unknown-unknown/wasm-release/active_site.wasm
          cargo build -p active-site --bin active-site --release
      # Same command as pages.yml: the static version of the site for GitHub Pages.
      - name: Export the site as static files
        run: BASE_PATH=/Active cargo run --release -p active-site -- export dist
      - name: Package the crate
        run: cargo package -p active --allow-dirty

  # Every branch is merged into master as soon as everything above is green (master is then
  # published on GitHub Pages by pages.yml). Branches named wip/... are never merged.
  merge:
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') &&
      github.ref_name != 'master' && !startsWith(github.ref_name, 'wip/')
    needs: [rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge into master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin master
      # A push made with GITHUB_TOKEN starts no workflow: release a new version by hand.
      - name: Release a new version (tag, GitHub release, crates.io)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref master --repo "$GITHUB_REPOSITORY" -f release=true
