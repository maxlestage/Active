name: Release

# Releases on its own: once CI is green on master, a version of crates/active/Cargo.toml
# that has no tag yet gets its tag (v0.1.0 for 0.1.0) and its GitHub release (notes from
# the commits), then the `active` crate is published on crates.io. Nothing to fill in by
# hand: change `version` in crates/active/Cargo.toml, push.
#
# A branch merged by the auto-merge of ci.yml reaches master without starting CI there (a
# push made with GITHUB_TOKEN starts no workflow): the auto-merge then runs this workflow
# itself, with `release`, after the merge.
#
# A GitHub Release published by hand with a tag like v0.2.0 (works from the GitHub website
# on a phone) publishes too: the version is then taken from the tag. Publication is skipped
# with a warning while the CARGO_REGISTRY_TOKEN secret is missing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: "Release the version of master if it has no tag yet (what the auto-merge runs)"
        type: boolean
        default: true

env:
  # The repositories are private: Cargo fetches the git dependencies (the other
  # repositories of the ecosystem) through git, which asks GitHub's credentials to a
  # helper reading the REPOS_TOKEN secret, a GitHub token that can read them. The
  # token stays out of every URL; without the secret, nothing changes.
  REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: ${{ secrets.REPOS_TOKEN != '' && 1 || 0 }}
  GIT_CONFIG_KEY_0: credential.https://github.com.helper
  GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$REPOS_TOKEN"; }; f'

jobs:
  tag:
    name: Tag the new version
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Release the version of the crate if it is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "active") | .version')
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists: nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "### 🏷️ [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG) released" >> "$GITHUB_STEP_SUMMARY"

  crate:
    needs: tag
    # `needs` skips this job for a release published by hand unless `always()` lets it through.
    if: >-
      always() &&
      (github.event_name == 'release' || needs.tag.outputs.created == 'true')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      TAG: ${{ github.event.release.tag_name || needs.tag.outputs.tag }}
    steps:
      - name: Check the tag
        id: version
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version like v1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::warning::CARGO_REGISTRY_TOKEN secret missing — cargo publish skipped."
      - if: env.CARGO_REGISTRY_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.sha || github.sha }}
      - if: env.CARGO_REGISTRY_TOKEN != ''
        uses: dtolnay/rust-toolchain@stable
      - if: env.CARGO_REGISTRY_TOKEN != ''
        name: Publish
        run: |
          sed -i '0,/^version = ".*"/s//version = "${{ steps.version.outputs.version }}"/' crates/active/Cargo.toml
          if curl -sf -o /dev/null -A "active-release (github.com/maxlestage/Active)" "https://crates.io/api/v1/crates/active/${{ steps.version.outputs.version }}"; then
            echo "active ${{ steps.version.outputs.version }} is already on crates.io."
            exit 0
          fi
          cargo test -p active
          cargo publish -p active --allow-dirty
