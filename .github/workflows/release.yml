name: Release

# Publish a GitHub Release with a tag like v0.2.0 (works from the GitHub website on a phone):
# the version is taken from the tag, the tests run, then the `active` crate is published on
# crates.io. Skipped with a warning while the CARGO_REGISTRY_TOKEN secret is missing.
on:
  release:
    types: [published]

jobs:
  crate:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check the tag
        id: version
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version like v1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::warning::CARGO_REGISTRY_TOKEN secret missing — cargo publish skipped."
      - if: env.CARGO_REGISTRY_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CARGO_REGISTRY_TOKEN != ''
        uses: dtolnay/rust-toolchain@stable
      - if: env.CARGO_REGISTRY_TOKEN != ''
        name: Publish
        run: |
          sed -i '0,/^version = ".*"/s//version = "${{ steps.version.outputs.version }}"/' crates/active/Cargo.toml
          cargo test -p active
          cargo publish -p active --allow-dirty
